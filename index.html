<!doctype html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Objetivos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <header class="border-b border-zinc-800 sticky top-0 backdrop-blur bg-zinc-950/90 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <div>
        <h1 class="text-xl font-semibold">Mapa de Objetivos</h1>
        <p id="breadcrumb" class="text-sm text-zinc-400"></p>
      </div>
      <div class="flex items-center gap-2">
        <button id="createSharedAdoptionBtn" class="hidden rounded-lg border border-emerald-700 bg-emerald-900/60 px-3 py-2 text-sm hover:bg-emerald-800/70">Criar adoção compartilhada</button>
        <button id="openModalBtn" class="h-10 w-10 rounded-full bg-blue-600 hover:bg-blue-500 transition text-xl font-bold">+</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="mb-4 flex flex-col gap-2">
      <a id="backLink" href="index.html" class="hidden text-sm text-blue-400 hover:text-blue-300">← Voltar um nível</a>
      <p id="adoptionInfo" class="text-xs text-zinc-400"></p>
    </div>
    <div id="status" class="text-zinc-400 mb-4"></div>
    <section id="cards" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></section>
  </main>

  <div id="modal" class="hidden fixed inset-0 bg-black/60 items-center justify-center p-4">
    <div class="w-full max-w-md rounded-xl border border-zinc-700 bg-zinc-900 p-5">
      <h2 class="text-lg font-semibold mb-4">Novo objetivo</h2>
      <form id="goalForm" class="space-y-4">
        <div>
          <label for="goalInput" class="text-sm text-zinc-300">Nome do objetivo</label>
          <input id="goalInput" type="text" required maxlength="255"
            class="mt-1 w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <label class="flex items-center gap-2 text-sm text-zinc-300">
          <input id="asRoot" type="checkbox" class="accent-blue-600" />
          Criar como objetivo raiz
        </label>

        <div class="flex justify-end gap-2">
          <button type="button" id="closeModalBtn" class="px-4 py-2 rounded-lg border border-zinc-700 hover:bg-zinc-800">Cancelar</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="settingsModal" class="hidden fixed inset-0 bg-black/60 items-center justify-center p-4">
    <div class="w-full max-w-md rounded-xl border border-zinc-700 bg-zinc-900 p-5">
      <h2 class="text-lg font-semibold mb-4">Configurar objetivo</h2>
      <form id="settingsForm" class="space-y-4">
        <div>
          <label for="settingsGoalInput" class="text-sm text-zinc-300">Texto do objetivo</label>
          <input id="settingsGoalInput" type="text" required maxlength="255"
            class="mt-1 w-full rounded-lg border border-zinc-700 bg-zinc-950 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <button type="button" id="adoptGoalBtn" class="w-full rounded-lg border border-emerald-700 bg-emerald-900/60 px-4 py-2 hover:bg-emerald-800/70">
          Adotar (copiar ID para adoção compartilhada)
        </button>

        <div class="flex justify-between gap-2">
          <button type="button" id="deleteGoalBtn" class="px-4 py-2 rounded-lg bg-red-700 hover:bg-red-600">Excluir</button>
          <div class="flex gap-2">
            <button type="button" id="closeSettingsModalBtn" class="px-4 py-2 rounded-lg border border-zinc-700 hover:bg-zinc-800">Cancelar</button>
            <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500">Salvar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    const query = new URLSearchParams(window.location.search);
    const currentId = query.get('id');

    const ADOPTED_GOAL_ID_KEY = 'adopted_goal_id';
    const ADOPTED_GOAL_NAME_KEY = 'adopted_goal_name';

    const breadcrumb = document.getElementById('breadcrumb');
    const cardsContainer = document.getElementById('cards');
    const statusEl = document.getElementById('status');
    const backLink = document.getElementById('backLink');
    const adoptionInfo = document.getElementById('adoptionInfo');
    const createSharedAdoptionBtn = document.getElementById('createSharedAdoptionBtn');
    const modal = document.getElementById('modal');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const goalForm = document.getElementById('goalForm');
    const goalInput = document.getElementById('goalInput');
    const asRoot = document.getElementById('asRoot');
    const settingsModal = document.getElementById('settingsModal');
    const settingsForm = document.getElementById('settingsForm');
    const settingsGoalInput = document.getElementById('settingsGoalInput');
    const deleteGoalBtn = document.getElementById('deleteGoalBtn');
    const closeSettingsModalBtn = document.getElementById('closeSettingsModalBtn');
    const adoptGoalBtn = document.getElementById('adoptGoalBtn');
    let selectedGoal = null;

    if (currentId) {
      breadcrumb.textContent = `Exibindo filhos do objetivo #${currentId}`;
      const backUrl = new URL(window.location.href);
      backUrl.searchParams.delete('id');
      backLink.href = backUrl.pathname + backUrl.search;
      backLink.classList.remove('hidden');
    } else {
      breadcrumb.textContent = 'Exibindo objetivos raiz';
    }

    function getAdoptedGoal() {
      const id = localStorage.getItem(ADOPTED_GOAL_ID_KEY);
      const name = localStorage.getItem(ADOPTED_GOAL_NAME_KEY);
      if (!id) {
        return null;
      }
      return { id: Number(id), name: name || `#${id}` };
    }

    function refreshAdoptionUi() {
      const adopted = getAdoptedGoal();
      if (!adopted) {
        adoptionInfo.textContent = 'Nenhum objetivo selecionado para adoção compartilhada.';
        createSharedAdoptionBtn.classList.add('hidden');
        return;
      }

      adoptionInfo.textContent = `Objetivo selecionado para adoção compartilhada: ${adopted.name} (ID ${adopted.id}).`;

      if (currentId && Number(currentId) !== adopted.id) {
        createSharedAdoptionBtn.classList.remove('hidden');
      } else {
        createSharedAdoptionBtn.classList.add('hidden');
      }
    }

    function openModal() {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      goalInput.focus();
      asRoot.checked = false;
    }

    function closeModal() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      goalForm.reset();
    }

    function openSettingsModal(item) {
      selectedGoal = item;
      settingsGoalInput.value = item.goal || '';
      settingsModal.classList.remove('hidden');
      settingsModal.classList.add('flex');
      settingsGoalInput.focus();
    }

    function closeSettingsModal() {
      settingsModal.classList.add('hidden');
      settingsModal.classList.remove('flex');
      settingsForm.reset();
      selectedGoal = null;
    }

    openModalBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', closeModal);
    closeSettingsModalBtn.addEventListener('click', closeSettingsModal);
    modal.addEventListener('click', (event) => {
      if (event.target === modal) {
        closeModal();
      }
    });
    settingsModal.addEventListener('click', (event) => {
      if (event.target === settingsModal) {
        closeSettingsModal();
      }
    });

    createSharedAdoptionBtn.addEventListener('click', async () => {
      const adopted = getAdoptedGoal();
      if (!currentId || !adopted) {
        return;
      }

      try {
        const response = await fetch('api.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'adopt',
            parent_id: Number(currentId),
            child_id: adopted.id,
          }),
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.details || data.error || 'Erro ao criar adoção compartilhada.');
        }

        alert(`Adoção compartilhada criada com sucesso para "${adopted.name}".`);
        await fetchGoals();
      } catch (error) {
        alert(error.message);
      }
    });

    adoptGoalBtn.addEventListener('click', async () => {
      if (!selectedGoal) {
        return;
      }

      localStorage.setItem(ADOPTED_GOAL_ID_KEY, String(selectedGoal.id));
      localStorage.setItem(ADOPTED_GOAL_NAME_KEY, selectedGoal.goal || `#${selectedGoal.id}`);

      try {
        await navigator.clipboard.writeText(String(selectedGoal.id));
        alert(`Objetivo ID ${selectedGoal.id} copiado. Agora entre em outro objetivo e clique em "Criar adoção compartilhada".`);
      } catch {
        alert(`Objetivo ID ${selectedGoal.id} salvo para adoção compartilhada. O navegador bloqueou a cópia automática.`);
      }

      refreshAdoptionUi();
      closeSettingsModal();
    });

    async function fetchGoals() {
      try {
        statusEl.textContent = 'Carregando objetivos...';

        const url = new URL('api.php', window.location.href);
        if (currentId) {
          url.searchParams.set('parent_id', currentId);
        }

        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.details || data.error || 'Erro desconhecido ao buscar objetivos.');
        }

        renderCards(data.items || []);
      } catch (error) {
        statusEl.textContent = `Erro: ${error.message}`;
      }
    }

    function renderCards(items) {
      cardsContainer.innerHTML = '';

      if (!items.length) {
        statusEl.textContent = 'Nenhum objetivo encontrado neste nível.';
        return;
      }

      statusEl.textContent = `${items.length} objetivo(s) encontrado(s).`;

      items.forEach((item) => {
        const card = document.createElement('article');
        card.className = 'relative rounded-xl border border-zinc-800 bg-zinc-900 p-4 hover:border-blue-500 transition cursor-pointer';
        card.innerHTML = `
          <button type="button" class="settings-btn absolute top-3 right-3 rounded-md border border-zinc-700 bg-zinc-800/90 px-2 py-1 text-xs hover:bg-zinc-700">
            ⚙
          </button>
          <h3 class="text-base font-semibold mb-2 pr-8">${escapeHtml(item.goal)}</h3>
          <button type="button" class="last-goal-tag inline-block text-left text-xs font-medium rounded-full px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 hover:bg-amber-500/30 transition">
            Último objetivo da família: ${escapeHtml(item.last_goal || item.goal)}
          </button>
        `;

        card.addEventListener('click', () => {
          const next = new URL(window.location.href);
          next.searchParams.set('id', item.id);
          window.location.href = next.pathname + next.search;
        });

        const lastGoalTag = card.querySelector('.last-goal-tag');
        const settingsBtn = card.querySelector('.settings-btn');
        if (lastGoalTag) {
          lastGoalTag.addEventListener('click', (event) => {
            event.stopPropagation();
            const next = new URL(window.location.href);
            next.searchParams.set('id', item.last_goal_id || item.id);
            window.location.href = next.pathname + next.search;
          });
        }
        if (settingsBtn) {
          settingsBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            openSettingsModal(item);
          });
        }

        cardsContainer.appendChild(card);
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    goalForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const payload = {
        goal: goalInput.value.trim(),
        parent_id: (!asRoot.checked && currentId) ? Number(currentId) : null,
      };

      if (!payload.goal) {
        return;
      }

      try {
        const response = await fetch('api.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.details || data.error || 'Erro ao salvar objetivo.');
        }

        closeModal();
        await fetchGoals();
      } catch (error) {
        alert(error.message);
      }
    });

    settingsForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!selectedGoal) {
        return;
      }

      const goal = settingsGoalInput.value.trim();
      if (!goal) {
        return;
      }

      try {
        const response = await fetch(`api.php?id=${selectedGoal.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ goal }),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.details || data.error || 'Erro ao atualizar objetivo.');
        }

        closeSettingsModal();
        await fetchGoals();
      } catch (error) {
        alert(error.message);
      }
    });

    deleteGoalBtn.addEventListener('click', async () => {
      if (!selectedGoal) {
        return;
      }

      const confirmed = window.confirm('Deseja realmente excluir este objetivo? Objetivos compartilhados em outros lugares continuarão existindo.');
      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch(`api.php?id=${selectedGoal.id}`, { method: 'DELETE' });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.details || data.error || 'Erro ao excluir objetivo.');
        }

        closeSettingsModal();
        await fetchGoals();
      } catch (error) {
        alert(error.message);
      }
    });

    refreshAdoptionUi();
    fetchGoals();
  </script>
</body>
</html>
